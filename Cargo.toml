[package]
name = "firewall-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for managing firewalld zones, ports, services, and rules"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
